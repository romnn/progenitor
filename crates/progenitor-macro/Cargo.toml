[package]
name = "progenitor-macro"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An OpenAPI client generator - macros"
repository = "https://github.com/oxidecomputer/progenitor.git"
readme = "../../README.md"

[lints]
workspace = true

[lib]
proc-macro = true

[features]
# Opt-in: lets `generate_api!` honor `server = true`. Empty by design — it only
# flips a `cfg` the proc-macro reads; it must NOT pull in a runtime server crate.
server = []

[dependencies]
proc-macro2 = "1.0"
progenitor-impl = { version = "0.14.0", path = "../progenitor-impl" }
quote = "1.0"
schemars = "0.8.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
serde_tokenstream = "0.2.3"
syn = { version = "2.0", features = ["full", "extra-traits"] }
