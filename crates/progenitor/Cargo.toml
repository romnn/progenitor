[package]
name = "progenitor"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An OpenAPI client generator"
repository = "https://github.com/oxidecomputer/progenitor.git"
readme = "../../README.md"
keywords = ["openapi", "openapiv3", "sdk", "generator", "proc_macro"]
categories = ["api-bindings", "compilers"]

[features]
default = ["macro"]
macro = ["dep:progenitor-client", "dep:progenitor-macro"]
# Opt-in server-stub generation: forwards to the macro's `server` feature so
# `generate_api!(server = true, ...)` emits a `pub mod server`. Deliberately does
# NOT depend on `progenitor-server` — the consumer adds that runtime crate to
# their own `[dependencies]` (the tonic-build/tonic split).
server = ["macro", "progenitor-macro/server"]

[dependencies]
progenitor-client = { workspace = true, optional = true }
progenitor-impl = { workspace = true }
progenitor-macro = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
regress = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
uuid = { workspace = true }

[[test]]
name = "build_buildomat"
required-features = ["macro"]

[[test]]
name = "build_keeper"
required-features = ["macro"]

[[test]]
name = "build_nexus"
required-features = ["macro"]

[[test]]
name = "build_propolis"
required-features = ["macro"]

[[test]]
name = "load_yaml"
required-features = ["macro"]

[[test]]
name = "test_client"
required-features = ["macro"]
