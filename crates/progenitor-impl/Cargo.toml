[package]
name = "progenitor-impl"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An OpenAPI client generator - core implementation"
repository = "https://github.com/oxidecomputer/progenitor.git"
readme = "../../README.md"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

# The generator assembles code from a validated internal model and still has
# legacy invariant unwraps plus large emitter functions. Keep these explicit
# so the workspace deny-set applies to every other lint and the list can be
# ratcheted down as those emitters are split. Cargo does not permit overriding
# inherited workspace lints, so this crate repeats the two lint groups before
# applying its narrow exceptions.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
elidable_lifetime_names = "allow"
expect_used = "allow"
format_collect = "allow"
format_push_string = "allow"
indexing_slicing = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
maybe_infinite_iter = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_for_each = "allow"
needless_pass_by_value = "allow"
panic = "allow"
ref_option = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unnecessary_trailing_comma = "allow"
unreachable = "allow"
unused_self = "allow"
unwrap_used = "allow"

[dependencies]
heck = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
proc-macro2 = { workspace = true }
prettyplease = { workspace = true }
quote = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
typify = { workspace = true }
unicode-ident = { workspace = true }

[dev-dependencies]
dropshot = { workspace = true }
indoc = { workspace = true }
expectorate = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
openapiv3 = { workspace = true }
progenitor-client = { workspace = true }
reqwest = { workspace = true }
rustfmt-wrapper = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
