[package]
name = "example-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
progenitor-client = { path = "../progenitor-client" }
reqwest = { version = "0.13.3", features = ["json", "query", "stream"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.23", features = ["serde", "v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.66"

[build-dependencies]
progenitor = { path = "../progenitor", default-features = false }
