# Wild-spec corpus manifest.
#
# Each entry pins the expected pipeline outcome (`expect`) so the suite
# works as a ratchet: a regression fails the build, and so does an
# unrecorded improvement. `slow = true` marks multi-minute documents only
# exercised when WILD_SLOW=1. Outcomes: pass | parse-fail | generate-fail
# | invalid-rust.

[[spec]]
name = "asana"
url = "https://raw.githubusercontent.com/Asana/openapi/master/defs/asana_oas.yaml"
version = "3.0"
expect = "pass"
slow = true
notes = "huge; official Asana OAS, YAML, heavy allOf composition"

