[workspace]
resolver = "3"
exclude = ["conformance"]
members = [
	"crates/cargo-progenitor",
	"crates/example-build",
	"crates/example-server",
	"crates/example-macro",
	"crates/example-out-dir",
	"crates/example-wasm",
	"crates/progenitor",
	"crates/progenitor-client",
	"crates/progenitor-impl",
	"crates/progenitor-macro",
	"crates/progenitor-server",
	"crates/typify",
	"crates/typify-impl",
	"crates/typify-macro",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
progenitor = { version = "0.14.0", path = "crates/progenitor", default-features = false }
progenitor-client = { version = "0.14.0", path = "crates/progenitor-client" }
progenitor-impl = { version = "0.14.0", path = "crates/progenitor-impl" }
progenitor-macro = { version = "0.14.0", path = "crates/progenitor-macro" }
progenitor-server = { version = "0.14.0", path = "crates/progenitor-server" }

anyhow = "1.0.102"
assert_cmd = "2.2.2"
async-trait = "0.1.83"
axum = { version = "0.8", default-features = false }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["serde"] }
clap = { version = "4.6.1" }
clap-cargo = "0.18.3"
dropshot = { version = "0.17.0", default-features = false }
env_logger = "0.11.10"
expectorate = { version = "1.2.0", features = ["predicates"] }
futures = "0.3.32"
futures-core = "0.3.32"
heck = "0.5.0"
http = "1.4.0"
hyper = "1.9.0"
indexmap = "2.14.0"
indoc = "2.0.7"
glob = "0.3.3"
ipnetwork = { version = "0.21.1", features = ["schemars"] }
log = "0.4.30"
newline-converter = "0.3.0"
paste = "1.0.15"
prettyplease = "0.2.37"
schema = "0.1.0"
serde_tokenstream = "0.2"
tempfile = "3.27.0"
trybuild = "1.0.116"
openapiv3 = "2.2.0"
percent-encoding = "2.3.2"
proc-macro2 = "1.0.106"
quote = "1.0.45"
rand = "0.10.1"
regex = "1.12.3"
regress = "0.11.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "stream"] }
rustfmt-wrapper = "0.2.1"
schemars = "0.8.22"
semver = "1.0.28"
serde = { version = "1.0.226", features = ["derive"] }
serde_html_form = "0.2.7"
# `preserve_order` is load-bearing: `parse_openapi_str` round-trips the
# document through `serde_json::Value`, and without it object keys are
# re-sorted alphabetically — silently reordering paths/components, which
# changes generated operation order and typify type naming.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9"
syn = { version = "2.0.117", features = ["full", "parsing"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "net"] }
tower = "0.5.2"
tower-http = "0.6.2"
typify = { version = "0.6.2", path = "crates/typify" }
typify-impl = { version = "0.6.2", path = "crates/typify-impl" }
typify-macro = { version = "0.6.2", path = "crates/typify-macro" }
url = "2.5.8"
unicode-ident = "1.0.24"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
