[alias]
c = 'check --workspace --lib'

l = "clippy --all-targets --no-deps"
lint = "clippy --all-targets --no-deps"
fixit = "clippy --fix --allow-dirty --allow-staged --all-targets --no-deps"

# Keep monster-spec generation usable on memory-constrained machines.
[build]
jobs = 1

# Faster linker for the dev profile. Disable or change to "lld" if mold is
# not installed.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
