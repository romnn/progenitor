[package]
name = "conformance-support"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "generate-all"
path = "src/bin/generate_all.rs"

[[bin]]
name = "new-spec"
path = "src/bin/new_spec.rs"

[dependencies]
anyhow = "1"
heck = { workspace = true }
httpmock = { workspace = true }
progenitor-impl = { path = "../../crates/progenitor-impl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
toml = "0.9"
ureq = "3.1"

[dev-dependencies]
progenitor-impl = { path = "../../crates/progenitor-impl" }
