# Conformance suite: one crate per real-world API spec. Each crate's
# build.rs generates the client with progenitor and its tests construct
# generated types — serving both as integration coverage and as worked
# examples for "how do I use progenitor with API X".
#
# This is a separate workspace so the main one stays fast. Some generated
# crates are large enough for a single rustc process to consume substantial
# memory, so the local Cargo configuration builds one crate at a time.
[workspace]
resolver = "2"
members = [
    "support",
    # original 12 conformance crates
    "anthropic",
    "discord",
    "figma",
    "github-31",
    "hetzner-cloud",
    "meilisearch",
    "openai",
    "perplexity",
    "qdrant",
    "resend",
    "svix",
    "twilio-api-v2010",
    # 6 wild-test crates from WS05
    "clickhouse-cloud",
    "cloudflare",
    "codat-accounting",
    "mongodb-atlas",
    "pagerduty",
    "petstore-31",
    # 3.1.x specs
    "airflow",
    "bfl",
    "chroma",
    "cratesio",
    "frankfurter",
    "gladia",
    "increase",
    "jina",
    "lago",
    "lambda-cloud",
    "lithic",
    "logfire",
    "netbird",
    "openrouter",
    "orb",
    "posthog",
    "runway",
    "scaleway-instance",
    "telnyx",
    "unstructured",
    "urlbox",
    "weather-gov",
    "workos",
    "xai",
    # 3.0.x specs
    "airbyte",
    "aiven",
    "circleci",
    "clerk",
    "deepl",
    "dub",
    "exoscale",
    "hubspot-contacts",
    "intercom",
    "jellyfin",
    "klaviyo",
    "neon",
    "nomad",
    "novu",
    "okta",
    "oxide",
    "pinecone",
    "polygon",
    "sentry",
    "spotify",
    "stytch",
    "superset",
    "twitter",
    "zoom",
    "binance",
    "deepinfra",
    "finch",
    "influxdb",
    "langsmith",
    "miro",
    "opensearch",
    "pokeapi",
    "vapi",
    "webflow",
    "zendesk",
]

# launchdarkly is intentionally not a default workspace member while its
# OAS 3 endpoint returns 403 AccessDenied. The public ld-openapi repository
# currently publishes only Swagger 2.0, which this branch does not parse.

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.dependencies]
conformance-support = { path = "support" }
progenitor = { path = "../crates/progenitor", default-features = false }
progenitor-client = { path = "../crates/progenitor-client" }
progenitor-server = { path = "../crates/progenitor-server", features = ["transport"] }
base64 = "0.22"
bytes = "1"
heck = "0.5.0"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures = "0.3"
futures-core = "0.3"
httpmock = "0.8.0-alpha.1"
percent-encoding = "2.3"
rand = "0.10"
regex = "1"
regress = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["serde"] }

# Debug metadata and incremental state for the largest generated modules add
# substantial memory and disk pressure. The conformance corpus favors
# predictable full checks over interactive debugging and rebuild latency.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Cargo builds build scripts and proc macros unoptimized by default. Both are
# hot here: every spec crate's build.rs runs the whole generator, and rustc then
# drives serde_derive tens of thousands of times over the result (cloudflare
# alone has ~24k derive sites). Paying to optimize them once is cheaper than
# running them unoptimized 78 times.
[profile.dev.build-override]
opt-level = 2

[profile.test.build-override]
opt-level = 2
