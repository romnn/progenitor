# Conformance suite: one crate per real-world API spec. Each crate's
# build.rs generates the client with progenitor and its tests construct
# generated types — serving both as integration coverage and as worked
# examples for "how do I use progenitor with API X".
#
# This is a separate workspace so the main one stays fast; build it with
# `cargo check` / `cargo test` from this directory. Crates type-check in
# parallel. Plain stable `cargo check` is the right tool: measured on the
# full workspace, nightly's parallel frontend (-Z threads=8) wins a cold
# build only modestly (~80s -> ~53s) and is ~3x SLOWER than stable for
# incremental single-crate recompiles, because the nightly compiler's
# per-crate overhead exceeds what its threading recovers.
[workspace]
resolver = "2"
members = [
    "support",
    # original 12 conformance crates
    "anthropic",
    "discord",
    "figma",
    "github-31",
    "hetzner-cloud",
    "meilisearch",
    "openai",
    "perplexity",
    "qdrant",
    "resend",
    "svix",
    "twilio-api-v2010",
    # 6 wild-test crates from WS05
    "clickhouse-cloud",
    "cloudflare",
    "codat-accounting",
    "mongodb-atlas",
    "pagerduty",
    "petstore-31",
    # 3.1.x specs
    "airflow",
    "bfl",
    "chroma",
    "cratesio",
    "frankfurter",
    "gladia",
    "increase",
    "jina",
    "lago",
    "lambda-cloud",
    "lithic",
    "logfire",
    "netbird",
    "openrouter",
    "orb",
    "posthog",
    "runway",
    "scaleway-instance",
    "telnyx",
    "unstructured",
    "urlbox",
    "weather-gov",
    "workos",
    "xai",
    # 3.0.x specs
    "airbyte",
    "aiven",
    "circleci",
    "clerk",
    "deepl",
    "dub",
    "exoscale",
    "hubspot-contacts",
    "intercom",
    "jellyfin",
    "klaviyo",
    "launchdarkly",
    "neon",
    "nomad",
    "novu",
    "okta",
    "oxide",
    "pinecone",
    "polygon",
    "sentry",
    "spotify",
    "stytch",
    "superset",
    "twitter",
    "zoom",
    "binance",
    "deepinfra",
    "finch",
    "influxdb",
    "langsmith",
    "miro",
    "opensearch",
    "pokeapi",
    "vapi",
    "webflow",
    "zendesk",
]

[workspace.dependencies]
conformance-support = { path = "support" }
progenitor = { path = "../crates/progenitor", default-features = false }
progenitor-client = { path = "../crates/progenitor-client" }
base64 = "0.22"
bytes = "1"
heck = "0.5.0"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures = "0.3"
futures-core = "0.3"
percent-encoding = "2.3"
rand = "0.10"
regress = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["serde"] }
