name = "launchdarkly"
url = "https://app.launchdarkly.com/api/v2/openapi.json"
version = "3.0"
notes = "live vendor endpoint; APIs.guru copy is stale Swagger 2.0"
# The AI/Agent/Announcement/ReleasePolicies/Views API schemas all use
# "{}" (JSON string) where the type expects a map, or null where a string
# is expected.  These are systematic LaunchDarkly vendor spec bugs where
# examples were written before the schema types were finalised.
# Double-underscore schemas (AgentGraph__maintainer, AIConfig__maintainer,
# AnnouncementResponse__links) must use the raw spec key, not the Rust ident.
bad_examples = [
    "AgentGraph",
    "AgentGraphEdge",
    "AgentGraphEdgePost",
    "AgentGraph__maintainer",
